[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "freightpact"
version = "0.1.0"
description = "Autonomous Cold-Chain Shipment Recovery Coordinator for Fetch-A-Thon 3.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "uagents>=0.25.0",
    "uagents-core>=0.4.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.0",
]

[project.scripts]
freightpact-demo = "freightpact.demo:main"

[tool.setuptools.packages.find]
where = ["src"]
